<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#000}canvas{display:block}</style><canvas id=c width=3840 height=2160></canvas>
<script>
// NIRO film wallpaper: deep indigo with soft luminous bands of blue, violet and a little cyan, so translucent glass has something to show.
const c=document.getElementById('c'),g=c.getContext('webgl2',{preserveDrawingBuffer:true}),vs=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`,fs=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p=p*2.03+vec2(7.1,3.7);a*=.5;}return s;}
void main(){vec2 q=uv*vec2(1.78,1.);vec2 w=vec2(fbm(q*1.3+vec2(0,2.)),fbm(q*1.3+vec2(5.2,1.3)));vec2 r=q+(w-.5)*1.15;
 float f=fbm(r*1.6+3.);float band=smoothstep(.35,.85,sin((r.x*1.2+r.y*2.1+f*2.4)*1.7)*.5+.5);float band2=smoothstep(.55,.95,sin((r.x*-.8+r.y*1.5+f*3.1)*1.4+1.5)*.5+.5);
 vec3 base=mix(vec3(.018,.03,.12),vec3(.035,.05,.2),fbm(q*.9));
 vec3 blue=vec3(.12,.32,.95),viol=vec3(.48,.26,.92),cy=vec3(.1,.7,.95);
 vec3 col=base+blue*band*.42*(.4+f)+viol*band2*.36*(.3+f)+cy*pow(band*band2,2.)*.35;
 col+=vec3(.2,.35,1.)*pow(max(0.,1.-length(uv-vec2(.78,.72))*1.6),2.)*.35+vec3(.5,.25,1.)*pow(max(0.,1.-length(uv-vec2(.16,.2))*1.7),2.)*.3;
 col*=1.-.55*pow(length(uv-.5)*1.15,2.2);
 col=col/(1.+col*.35); col=pow(col,vec3(.9));
 o=vec4(col+ (h(uv*3840.)-.5)/255.,1);}`;
function sh(t,s){const x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))console.error(g.getShaderInfoLog(x));return x}
const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,vs));g.attachShader(pr,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(pr);g.useProgram(pr);
const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);const l=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);
g.viewport(0,0,3840,2160);g.drawArrays(g.TRIANGLE_STRIP,0,4);window.__ready=true;
</script>
